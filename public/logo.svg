<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Studio logo">
  <!-- Orbits from the hero orrery: one core, several disciplines in motion around it. -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#201f1d" stroke-opacity=".22" stroke-width="1.2"/>
  <g fill="none" stroke-width="2.2">
    <ellipse cx="32" cy="32" rx="26" ry="9" stroke="#b68235" transform="rotate(-18 32 32)"/>
    <ellipse cx="32" cy="32" rx="20" ry="11" stroke="#e8622a" transform="rotate(52 32 32)"/>
    <ellipse cx="32" cy="32" rx="14" ry="6" stroke="#7d5411" transform="rotate(-62 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="5.5" fill="#201f1d"/>
  <circle cx="32" cy="32" r="2.2" fill="#b68235"/>
  <!-- Planets riding each orbit -->
  <circle cx="56.7" cy="24" r="3.2" fill="#b68235"/>
  <circle cx="19.7" cy="16.2" r="2.8" fill="#e8622a"/>
  <circle cx="25.4" cy="44.4" r="2.4" fill="#7d5411"/>
</svg>
